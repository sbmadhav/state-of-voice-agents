name: Design system

# The pages pin sbmadhav.com design system 2.1.0 and hold the shared header, composed in from the
# vendored header.html with compose.py (there is no build here, so the composed header is committed).
# Fails if a page's header is out of step with the pinned partial; warns if the vendored copies
# differ from the published, immutable /design-system/v/<version>/ files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DS: vendor/design-system-2.1.0
      DS_URL: https://sbmadhav.com/design-system/v/2.1.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Every page's header matches the pinned header.html
        run: python3 "$DS/compose.py" --check "$DS/header.html" index.html editions/*/index.html

      - name: Every page links the same pinned version, and no Google Fonts
        run: |
          set -e
          for f in index.html editions/*/index.html; do
            for asset in tokens.css components.css header.js; do
              grep -q "/design-system/v/2.1.0/$asset" "$f" || { echo "::error file=$f::does not load /design-system/v/2.1.0/$asset"; exit 1; }
            done
            if grep -q 'fonts.googleapis.com\|fonts.gstatic.com' "$f"; then echo "::error file=$f::loads Google Fonts; use the self-hosted /assets/fonts/ from tokens.css"; exit 1; fi
          done

      # Warns, never fails: the published versioned files are immutable, so a difference means the vendored copy was edited
      - name: Vendored copies match the published design system
        run: |
          for f in header.html compose.py; do
            curl -fsSL "$DS_URL/$f" -o "/tmp/$f" && cmp -s "/tmp/$f" "$DS/$f" || echo "::warning file=$DS/$f::differs from $DS_URL/$f (or could not be fetched)"
          done
